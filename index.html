<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flag Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --sky:#D9EEF6; --sea:#BFE2EE; --ink:#12304A; --ink-soft:#4B6A82;
  --blue:#1E5BD8; --blue-deep:#153F9A; --red:#E5483B; --yellow:#F5B83D; --green:#2E9E6B;
  --line:rgba(18,48,74,.16);
  --bg:#EEF6FA; --card:#fff; --text:var(--ink); --muted:var(--ink-soft);
  --accent:var(--blue); --good:var(--green); --bad:var(--red); --border:var(--line);
}
*{box-sizing:border-box}
html{background:#BFE2EE}
body{
  margin:0;color:var(--ink);min-height:100vh;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-optical-sizing:auto;
  background:
    repeating-linear-gradient(0deg,rgba(18,48,74,.05) 0 1px,transparent 1px 56px),
    repeating-linear-gradient(90deg,rgba(18,48,74,.05) 0 1px,transparent 1px 56px),
    linear-gradient(180deg,var(--sky) 0%,var(--sea) 100%);
  background-attachment:fixed;
}
.bunting{display:block;width:100%;height:78px}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sway 4.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
@media(prefers-reduced-motion:reduce){.sw{animation:none}}
.wrap{max-width:1100px;margin:auto;padding:6px 18px 40px}
header{text-align:center;margin:4px 0 14px}
h1{margin:0;font-size:clamp(38px,7vw,62px);font-weight:800;letter-spacing:-.028em;line-height:1}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.mode-badge{background:#fff;border-radius:99px;padding:9px 16px;font-size:14px;font-weight:700;box-shadow:0 2px 0 var(--line)}

.scoreboard{display:flex;align-items:flex-end;gap:12px 22px;max-width:760px;margin:0 auto 20px;flex-wrap:wrap}
.progress-block{flex:1 1 260px}
.progress-label{font-size:14px;margin-bottom:6px;color:var(--ink-soft)}
.progress-label b{color:var(--ink);font-size:20px;font-weight:800}
.progress{height:12px;background:rgba(18,48,74,.13);border-radius:99px;overflow:hidden}
#progressFill{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .35s ease}
.sc{text-align:center;min-width:58px}
.sc b{display:block;font-size:26px;line-height:1;font-weight:800}
.sc span{font-size:12px;color:var(--ink-soft)}

.question{max-width:760px;margin:0 auto 18px;filter:drop-shadow(0 7px 0 rgba(18,48,74,.22))}
.q-inner{
  background:var(--ink);color:#fff;text-align:center;padding:22px 58px 20px;
  clip-path:polygon(0 0,100% 0,calc(100% - 26px) 50%,100% 100%,0 100%,26px 50%);
}
.question .label{font-size:14px;color:#A9C4D8;margin-bottom:2px}
.question .country{font-size:clamp(26px,5.2vw,42px);font-weight:800;letter-spacing:-.015em;line-height:1.1}
.feedback{min-height:24px;font-weight:700;margin-top:8px}
.feedback small{font-size:13px;font-weight:600;opacity:.9}
.feedback u{text-decoration-thickness:2px;text-underline-offset:3px}
.feedback.good{color:#7FE3AE}
.feedback.bad{color:#FF9B8F}
.answer-controls{min-height:44px;margin-top:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

button{
  font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--blue);color:#fff;
  padding:10px 18px;cursor:pointer;box-shadow:0 3px 0 var(--blue-deep);
  transition:transform .08s,box-shadow .08s,filter .15s;
}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-deep)}
button:focus-visible,.flag-card:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn-secondary{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(18,48,74,.22)}
.btn-secondary:active{box-shadow:0 1px 0 rgba(18,48,74,.22)}
.q-inner .btn-secondary{background:rgba(255,255,255,.15);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn-next{background:var(--green);box-shadow:0 3px 0 #1F7450}
.btn-next:active{box-shadow:0 1px 0 #1F7450}

.controls{display:flex;gap:12px 26px;justify-content:center;flex-wrap:wrap;margin:0 0 20px}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer}
.switch input{
  appearance:none;-webkit-appearance:none;margin:0;flex:none;position:relative;cursor:pointer;
  width:40px;height:23px;border-radius:99px;background:#9DB5C7;transition:background .2s;
}
.switch input::after{
  content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s;
}
.switch input:checked{background:var(--blue)}
.switch input:checked::after{transform:translateX(17px)}
.switch input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.map-panel{display:none;max-width:760px;margin:0 auto 20px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 0 var(--line),0 12px 28px rgba(18,48,74,.12)}
.map-panel.show{display:block}
.map-title{text-align:center;font-weight:800;font-size:18px;margin:2px 0 10px}
.map-wrap{position:relative;border-radius:12px;overflow:hidden;background:#eef2f7}
#leafletMap{width:100%;height:320px}
.map-note{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:8px}

.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 14px}
.flag-card{position:relative;min-width:0;cursor:pointer;transition:transform .15s}
.flag-card:hover{transform:translateY(-3px)}
.flag-card img{
  display:block;width:100%;aspect-ratio:3/2;object-fit:contain;background:#fff;border-radius:6px;
  box-shadow:0 2px 0 rgba(18,48,74,.2),0 8px 16px rgba(18,48,74,.15);
}
.flag-name{font-size:13px;text-align:center;font-weight:700;margin-top:8px;min-height:16px;visibility:hidden}
.flag-card.identified{opacity:.5;cursor:default}
.flag-card.identified:hover{transform:none}
.flag-card.identified .flag-name{visibility:visible}
.flag-card.failed{opacity:.55}
.flag-card.failed img{filter:grayscale(1)}
.flag-card.wrong{animation:shake .24s linear}
.flag-card.wrong img{outline:3px solid var(--red);outline-offset:2px}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}

.end{display:none;text-align:center;background:#fff;border-radius:18px;padding:26px;margin-top:22px;box-shadow:0 3px 0 var(--line),0 12px 28px rgba(18,48,74,.12)}
.end.show{display:block}
.end h2{margin:0 0 8px;font-size:26px;font-weight:800}
.end-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.stats-table{width:100%;max-width:520px;margin:10px auto 0;border-collapse:collapse;font-size:14px;text-align:left}
.stats-table th{font-size:12px;font-weight:600;color:var(--ink-soft)}
.stats-table th,.stats-table td{padding:7px 8px;border-bottom:1px solid var(--line)}
.stats-table img{width:30px;vertical-align:middle;border-radius:3px;margin-right:6px;box-shadow:0 1px 3px rgba(18,48,74,.3)}
.stats-note{font-size:12px;color:var(--ink-soft);margin-top:8px}

.modal{display:none;position:fixed;inset:0;background:rgba(18,48,74,.6);z-index:1000;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.modal.show{display:flex}
.modal-card{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-card h2{margin:0 0 4px;font-size:24px;font-weight:800}
.modal-card h3{margin:20px 0 8px;font-size:16px;font-weight:700}
.share-box{display:none;margin:12px 0 4px;padding:14px;border-radius:16px;background:#EAF4F9;border:2px dashed #A9C9DA;text-align:center}
.share-box.show{display:block}
.share-box pre{margin:0 0 12px;font:inherit;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.modal-close{position:absolute;top:12px;right:12px;background:transparent;color:var(--ink-soft);padding:6px 10px;font-size:16px;box-shadow:none}
.modal-close:active{box-shadow:none;transform:none}
.tabs{display:flex;gap:4px;margin:12px 0 16px;background:#E3EEF4;border-radius:14px;padding:4px}
.tab{flex:1;background:transparent;color:var(--ink);box-shadow:none;padding:8px}
.tab:active{box-shadow:none;transform:none}
.tab.active,.tab.active:active{background:#fff;box-shadow:0 1px 3px rgba(18,48,74,.25)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:12px;padding:12px 4px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:800}
.kpi span{font-size:12px;color:var(--ink-soft)}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bar-label{width:34px;text-align:right;color:var(--ink-soft)}
.bar-track{flex:1;background:#E3EEF4;border-radius:6px;height:20px;overflow:hidden}
.bar{height:100%;background:#9DB5C7;border-radius:6px}
.bar.mine{background:var(--blue)}
.bar-val{width:34px;color:var(--ink-soft);font-size:12px}

@media(max-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:600px){
  .bunting{height:58px}
  .wrap{padding:4px 12px 32px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}
  .flag-name{font-size:11px}
  .q-inner{padding:18px 40px 16px;clip-path:polygon(0 0,100% 0,calc(100% - 18px) 50%,100% 100%,0 100%,18px 50%)}
  .progress-block{flex-basis:100%}
  .sc{flex:1}
  #leafletMap{height:230px}
}
</style>
</head>

<div class="wrap">
  <header>
    <h1>Flag Challenge</h1>
  </header>

  <div class="actions">
    <div class="mode-badge" id="modeBadge">Desafío diario</div>
    <button id="modeToggle" class="btn-secondary">Jugar aleatorio</button>
    <button id="statsBtn" class="btn-secondary">Estadísticas</button>
  </div>

  <div class="scoreboard">
    <div class="progress-block">
      <div class="progress-label"><b id="correct">0</b>/30 aciertos</div>
      <div class="progress"><div id="progressFill"></div></div>
    </div>
    <div class="sc"><b id="wrong">0</b><span>errores</span></div>
  </div>

  <section class="question">
    <div class="q-inner">
      <div class="label">Busca la bandera de</div>
      <div class="country" id="target">—</div>
      <div id="feedback" class="feedback"></div>
      <div class="answer-controls">
        <button id="nextBtn" class="btn-next" style="display:none">Siguiente</button>
      </div>
    </div>
  </section>

  <section class="controls">
    <label class="switch">
      <input id="showWrongName" type="checkbox" checked>
      Mostrar país al equivocarse
    </label>
    <label class="switch">
      <input id="showMap" type="checkbox">
      Mostrar ubicación al acertar
    </label>
  </section>

  <section id="mapPanel" class="map-panel">
    <div class="map-title" id="mapTitle"></div>
    <div class="map-wrap" id="mapWrap">
      <div id="leafletMap"></div>
    </div>
    <div class="map-note">Ubicación aproximada del país.</div>
  </section>

  <main id="grid" class="grid"></main>

  <section id="end" class="end">
    <h2 id="endTitle">🎉 ¡Completaste las 30!</h2>
    <p id="finalText"></p>
    <div class="end-actions">
      <button id="endStatsBtn" class="btn-secondary">Ver estadísticas</button>
      <button id="restart">Jugar de nuevo</button>
    </div>
  </section>
</div>

<div id="statsModal" class="modal">
  <div class="modal-card">
    <button id="statsClose" class="modal-close" aria-label="Cerrar">✕</button>
    <h2>Estadísticas</h2>
    <div id="shareBox" class="share-box">

async function sbRpc(name, body){

/* ============ Utilidades: fecha, aleatoriedad con semilla, storage ============ */
function dateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todayKey(){ return dateKey(new Date()); }
function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++) h=(Math.imul(31,h)+s.charCodeAt(i))|0;
  return h;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rng){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(rng()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function loadJSON(key, fallback){
  try{ const v=JSON.parse(localStorage.getItem(key)); return v===null||v===undefined?fallback:v }catch(e){ return fallback }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)) }catch(e){} }

/* ============ Estado del juego ============ */
let pool=[], current=null, correct=0, wrong=0, mode="daily", dailyKey=todayKey();
const grid=document.getElementById("grid");

const modeToggle=document.getElementById("modeToggle");

function dailyStorageKey(){ return "flagmaster_daily_"+dailyKey; }
function persistDaily(){
  if(mode!=="daily") return;
  saveJSON(dailyStorageKey(), {
    pool, correct, wrong,
    currentCode: current ? current.code : null,
    finished: pool.every(c=>c.identified)
  });
}
function updateModeUI(){
  if(mode==="daily"){
    const d=new Date(dailyKey+"T00:00:00");
    modeBadge.textContent="Desafío del "+d.toLocaleDateString("es",{day:"numeric",month:"long"});
    modeToggle.textContent="Jugar aleatorio";
  }else{
    modeBadge.textContent="Modo aleatorio";
    modeToggle.textContent="Volver al diario";
  }
}

function start(opts={}){
  mode = opts.mode || mode;
  document.getElementById("end").classList.remove("show");
  feedback.textContent=""; feedback.className="feedback";
  mapPanel.classList.remove("show");
  nextBtn.style.display="none";
  updateModeUI();

  if(mode==="daily"){
    dailyKey = todayKey();
    updateModeUI();
    const saved = loadJSON(dailyStorageKey(), null);
    if(saved){
      pool=saved.pool; correct=saved.correct; wrong=saved.wrong;
      render();
      if(saved.finished){
        finish();
      }else{
        current = saved.currentCode ? pool.find(c=>c.code===saved.currentCode) : null;
        if(current){ target.textContent=current.name; } else { nextQuestion(); return; }
      }
      updateStats();
      return;
    }
    const rng=mulberry32(hashStr("flagmaster-"+dailyKey));
    pool=seededShuffle(countries, rng).slice(0,30).map(([code,name])=>({code,name,identified:false,failed:false}));
  }else{
    pool=shuffle(countries).slice(0,30).map(([code,name])=>({code,name,identified:false,failed:false}));
  }
  correct=wrong=0;
  render();
  nextQuestion();
  updateStats();
  persistDaily();
}
function render(){
  grid.innerHTML="";
  pool.forEach((c,i)=>{
    const card=document.createElement("div");
    card.className="flag-card"+(c.identified?" identified":"")+(c.failed?" failed":"");
    card.dataset.index=i;
    card.innerHTML=`<img src="https://flagcdn.com/w320/${c.code}.png" alt="Bandera">
                    <div class="flag-name">${c.identified?c.name:""}</div>`;
    card.tabIndex=0; card.setAttribute("role","button");
    card.onclick=()=>guess(i,card);
    card.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); guess(i,card); } });
    grid.appendChild(card);
  });
}
function nextQuestion(){
  const remaining=pool.filter(c=>!c.identified);
  if(!remaining.length){finish(true);return}
  current=remaining[Math.floor(Math.random()*remaining.length)];
  target.textContent=current.name;
  feedback.textContent="";
  feedback.className="feedback";
  mapPanel.classList.remove("show");
  nextBtn.style.display="none";
  persistDaily();
}
function guess(index,card){
  if(pool[index].identified || !current) return;
  const chosen=pool[index];
  if(chosen.code===current.code){
    chosen.identified=true;
    correct++;
    feedback.textContent="✓ ¡Correcto!";
    feedback.className="feedback good";
    card.classList.add("identified");
    card.querySelector(".flag-name").textContent=chosen.name;
    recordFlag(chosen.code, true);
    updateStats();
    persistDaily();
    if(document.getElementById("showMap").checked){
      showMap(chosen);
      current=null;
      nextBtn.style.display="";
    }else{
      setTimeout(nextQuestion,650);
    }
    return;
  }
  // Fallo: cuenta como error, se revela la correcta en gris y se sigue con "Siguiente"
  wrong++;
  const c=current;
  const idx=pool.findIndex(x=>x.code===c.code);
  c.identified=true; c.failed=true;
  const real=grid.children[idx];
  if(real){
    real.classList.add("identified","failed");
    real.querySelector(".flag-name").textContent=c.name;
  }
  card.classList.remove("wrong"); void card.offsetWidth; card.classList.add("wrong");
  setTimeout(()=>card.classList.remove("wrong"),350);
  const showName=document.getElementById("showWrongName").checked;
  feedback.innerHTML=`✗ Fallaste. La bandera de <u>${c.name}</u> es la que quedó en gris.`+(showName?`<br><small>La que elegiste es la de ${chosen.name}.</small>`:"");
  feedback.className="feedback bad";
  recordFlag(c.code, false);
  if(document.getElementById("showMap").checked) showMap(c);
  current=null;
  updateStats(); persistDaily();
  nextBtn.style.display="";
}
nextBtn.onclick=nextQuestion;
function resultRows(){
  const sq=pool.map(c=>c.failed?"⬛":"🟩");
  const rows=[]; for(let i=0;i<sq.length;i+=6) rows.push(sq.slice(i,i+6).join(""));
  return rows.join("\n");
}
function updateStats(){
  document.getElementById("correct").textContent=correct;
  document.getElementById("wrong").textContent=wrong;
  const done=pool.filter(c=>c.identified).length;
  document.getElementById("progressFill").style.width=(done/30*100)+"%";
}

/* ============ Mapa (Leaflet + OpenStreetMap) ============ */
const TINY_COUNTRIES=new Set(["va","mc","sm","li","sg","mt","ad","bh","mv","nr","tv","ki","pw","mh","ws","lc","vc","kn","gd","dm","ag","bb","st","cv"]);
const HUGE_COUNTRIES=new Set(["ru","ca","cn","us","br","au","in","kz","dz","cd","sa","mx","id","sd","ly","ir","mn","ar"]);
function zoomFor(code){
  if(TINY_COUNTRIES.has(code)) return 7;
  if(HUGE_COUNTRIES.has(code)) return 3;
  return 5;
}
let leafletMap=null, leafletMarker=null;
function showMap(c){
  document.getElementById("mapTitle").textContent="📍 "+c.name;
  mapPanel.classList.add("show");
  const xy=coords[c.code];
  if(!xy) return;
  const [lat,lon]=xy;
  const zoom=zoomFor(c.code);
  setTimeout(()=>{
    if(!leafletMap){
      leafletMap=L.map("leafletMap",{scrollWheelZoom:false}).setView([lat,lon],zoom);
      L.tileLayer("https://tile.openstreetmap.de/{z}/{x}/{y}.png",{
        maxZoom:18,
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(leafletMap);
      leafletMarker=L.marker([lat,lon]).addTo(leafletMap);
    }else{
      leafletMap.invalidateSize();
      leafletMap.setView([lat,lon],zoom);
      leafletMarker.setLatLng([lat,lon]);
    }
  },30);
}

/* ============ Estadísticas personales y globales ============ */
const HIST_KEY="flagmaster_history", FLAGP_KEY="flagmaster_flagpersonal";

function recordFlag(code, firstTry){
  reportStat(code, firstTry);
  const s=loadJSON(FLAGP_KEY,{});
  const e=s[code]||{a:0,c:0};
  e.a++; if(firstTry) e.c++;
  s[code]=e; saveJSON(FLAGP_KEY,s);
}
async function recordDailyIfNeeded(){
  if(mode!=="daily") return;
  const hist=loadJSON(HIST_KEY,{});
  if(!hist[dailyKey]){
    hist[dailyKey]={wrong,correct,sent:false};
    saveJSON(HIST_KEY,hist);
  }
  if(hist[dailyKey].sent===false){ // reintenta si el envío anterior falló
    const ok=await reportDaily(dailyKey, hist[dailyKey].wrong);
    if(ok){
      const h=loadJSON(HIST_KEY,{});
      if(h[dailyKey]){ h[dailyKey].sent=true; saveJSON(HIST_KEY,h); }
    }
  }
}
function dayStreak(hist){
  let n=0; const cur=new Date();
  if(!hist[dateKey(cur)]) cur.setDate(cur.getDate()-1);
  while(hist[dateKey(cur)]){ n++; cur.setDate(cur.getDate()-1); }
  return n;
}
function flagTable(rows, thirdLabel){
  return `<table class="stats-table"><tr><th></th><th>País</th><th>% de aciertos</th><th>${thirdLabel}</th></tr>`
    + rows.map(r=>`<tr><td><img src="https://flagcdn.com/w40/${r.code}.png" alt=""></td><td>${nameByCode[r.code]||r.code}</td><td>${r.pct}%</td><td>${r.n}</td></tr>`).join("")
    + `</table>`;
}
function renderPersonal(){
  const hist=loadJSON(HIST_KEY,{});
  const days=Object.keys(hist);

  if(!days.length && !seen){
    return `<p class="stats-note">Todavía no tienes partidas guardadas. ¡Juega el desafío de hoy!</p>`;
  }
  const best=days.length ? Math.min(...days.map(d=>hist[d].wrong)) : "–";
  const avgErr=days.length ? (days.reduce((s,d)=>s+hist[d].wrong,0)/days.length).toFixed(1) : "–";
  const perfect=days.filter(d=>hist[d].wrong===0).length;
  let html=`<div class="kpis">
    <div class="kpi"><b>${days.length}</b><span>Días jugados</span></div>

    <div class="kpi"><b>${best}</b><span>Mejor día (errores)</span></div>
    <div class="kpi"><b>${avgErr}</b><span>Errores por día</span></div>
    <div class="kpi"><b>${seen}/${countries.length}</b><span>Banderas vistas</span></div>
  </div>`;
  const hard=Object.entries(fp)
    .filter(([,e])=>e.c<e.a)
    .map(([code,e])=>({code,n:e.a,pct:Math.round(e.c/e.a*100)}))
    .sort((a,b)=>a.pct-b.pct||b.n-a.n).slice(0,5);
  if(hard.length) html+=`<h3>Las banderas que más te cuestan</h3>`+flagTable(hard,"Veces");
  html+=`<p class="stats-note">Guardado en este navegador. Si borras los datos del sitio o cambias de dispositivo, se reinicia.</p>`;
  return html;
}
const BUCKETS=[["0",0,0],["1",1,1],["2",2,2],["3",3,3],["4-5",4,5],["6-9",6,9],["10+",10,999]];
async function renderGlobal(){

    sbGet(`daily_results?day=eq.${dailyKey}&select=errors,players`),

  }else{
    const counts=BUCKETS.map(([l,lo,hi])=>({l,lo,hi,n:rowsD.filter(r=>r.errors>=lo&&r.errors<=hi).reduce((s,r)=>s+r.players,0)}));
    const max=Math.max(...counts.map(c=>c.n),1);
    html+=counts.map(c=>{
      const isMine=mine && mine.wrong>=c.lo && mine.wrong<=c.hi;
      const w=c.n ? Math.max(c.n/max*100,3) : 0;
      return `<div class="bar-row"><span class="bar-label">${c.l}</span><div class="bar-track"><div class="bar ${isMine?"mine":""}" style="width:${w}%"></div></div><span class="bar-val">${c.n}</span></div>`;
    }).join("");
    html+=`<p class="stats-note">Cantidad de jugadores según sus errores · ${total} jugador${total===1?"":"es"} hoy${mine?` · tú: ${mine.wrong}`:""}</p>`;
    if(mine && total>1){
      const others=total-1;
      const worse=rowsD.filter(r=>r.errors>mine.wrong).reduce((s,r)=>s+r.players,0);
      const pct=Math.round(worse/others*100);
      html+= pct>0
        ? `<p>Tuviste menos errores que el <b>${pct}%</b> de los demás jugadores.</p>`
        : `<p>Hoy fue un desafío difícil. ¡Mañana hay revancha!</p>`;
    }
  }
  const rows=(flags||[]).filter(r=>r.attempts>=3)
    .map(r=>({code:r.code,n:r.attempts,pct:Math.round(r.correct/r.attempts*100)}))
    .sort((a,b)=>a.pct-b.pct||b.n-a.n).slice(0,8);
  if(rows.length) html+=`<h3>Las banderas que más le cuestan a todos</h3>`+flagTable(rows,"Intentos")
    +`<p class="stats-note">% de veces que se acertó cada bandera, entre todos los jugadores (mínimo 3 intentos).</p>`;
  return html;
}
let statsTab="personal";
async function openStats(tab){
  statsTab=tab||statsTab;
  const modal=document.getElementById("statsModal");
  modal.classList.add("show");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===statsTab));
  const canShare = mode==="daily" && pool.length>0 && pool.every(c=>c.identified);
  document.getElementById("shareBox").classList.toggle("show",canShare);
  if(canShare) document.getElementById("sharePreview").textContent=shareText().replace(/\n?https?:\/\/\S+$/,"");
  const body=document.getElementById("statsBody");
  const wanted=statsTab;
  if(wanted==="personal"){ body.innerHTML=renderPersonal(); return; }
  body.innerHTML=`<p class="stats-note">Cargando…</p>`;
  const html=await renderGlobal();
  if(statsTab===wanted && modal.classList.contains("show")) body.innerHTML=html;
}
function closeStats(){ document.getElementById("statsModal").classList.remove("show"); }

/* ============ Pantalla final ============ */
async function finish(fromPlay=false){
  current=null; target.textContent="¡Terminaste!";
  feedback.textContent="";
  nextBtn.style.display="none";
  persistDaily();
  document.getElementById("endTitle").textContent = mode==="daily" ? "🎉 ¡Desafío diario completado!" : "🎉 ¡Completaste las 30!";
  let text = `Acertaste ${correct} de 30 banderas, con ${wrong} error${wrong===1?"":"es"}.`;
  if(mode==="daily") text += " Vuelve mañana para un nuevo desafío.";
  document.getElementById("finalText").textContent=text;
  document.getElementById("end").classList.add("show");
  document.getElementById("restart").style.display = mode==="daily" ? "none" : "";
  document.getElementById("shareBtn").style.display = mode==="daily" ? "" : "none";
  await recordDailyIfNeeded();
  if(fromPlay && mode==="daily") openStats("global");
}

/* ============ Controles ============ */
document.getElementById("restart").onclick=()=>start();
document.getElementById("showMap").addEventListener("change",()=>{
  if(!document.getElementById("showMap").checked) mapPanel.classList.remove("show");
});
modeToggle.onclick=()=>{
  start({mode: mode==="daily" ? "random" : "daily"});
};
document.getElementById("statsBtn").onclick=()=>openStats("personal");
document.getElementById("endStatsBtn").onclick=()=>openStats(mode==="daily" ? "global" : "personal");
document.getElementById("statsClose").onclick=closeStats;
document.getElementById("statsModal").addEventListener("click",e=>{ if(e.target.id==="statsModal") closeStats(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeStats(); });
document.querySelectorAll(".tab").forEach(t=>{ t.onclick=()=>openStats(t.dataset.tab); });
function shareText(){
  return `Flag Challenge ${dailyKey}\n${correct}/30 · ${wrong} error${wrong===1?"":"es"}\n${resultRows()}\n${location.href.split("#")[0]}`;
}
document.getElementById("shareBtn").onclick=async()=>{
  const b=document.getElementById("shareBtn");
  const txt=shareText();
  try{
    await navigator.clipboard.writeText(txt);
    b.textContent="✓ ¡Copiado!";
    setTimeout(()=>{ b.textContent="Compartir resultado"; },1800);
  }catch(e){ prompt("Copia tu resultado:",txt); }
};
start();
